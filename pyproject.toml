[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trustrail"
version = "0.2.0"
description = "Supplier payments by trust: exact-amount single-use cards for new suppliers, bank-change stops, human approval. Airwallex sandbox only."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
trustrail = "trustrail.cli:main"

[tool.setuptools]
packages = ["trustrail"]

[tool.setuptools.package-data]
trustrail = ["static/*.html", "static/*.png"]
